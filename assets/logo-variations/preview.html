<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invest in Bali logo variaties</title>
    <style>
      body {
        margin: 0;
        padding: 48px;
        background: #efe8de;
        color: #211813;
        font-family: Manrope, Arial, sans-serif;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 34px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 26px;
      }
      .card {
        padding: 24px;
        border-radius: 28px;
        background: #fff8ef;
        box-shadow: 0 24px 64px rgba(40, 32, 26, 0.18);
      }
      img {
        width: 100%;
        display: block;
        border-radius: 22px;
      }
      h2 {
        margin: 16px 0 0;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Invest in Bali - variaties op gekozen icoon</h1>
    <main class="grid">
      <section class="card"><img src="./villa-gate-variant-01-balanced-door.svg" alt="Variant 01 balanced door"><h2>01 Balanced door</h2></section>
      <section class="card"><img src="./villa-gate-variant-02-open-villa.svg" alt="Variant 02 open villa"><h2>02 Open villa</h2></section>
      <section class="card"><img src="./villa-gate-variant-03-arch-entry.svg" alt="Variant 03 arch entry"><h2>03 Arch entry</h2></section>
      <section class="card"><img src="./villa-gate-variant-04-solid-villa.svg" alt="Variant 04 solid villa"><h2>04 Solid villa</h2></section>
      <section class="card"><img src="./villa-gate-variant-05-window-door.svg" alt="Variant 05 window door"><h2>05 Window + door</h2></section>
      <section class="card"><img src="./villa-gate-variant-06-ultra-simple.svg" alt="Variant 06 ultra simple"><h2>06 Ultra simple</h2></section>
    </main>
  </body>
</html>
