<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invest in Bali logo concepts</title>
    <style>
      body {
        margin: 0;
        padding: 48px;
        background: #efe8de;
        font-family: Manrope, Arial, sans-serif;
        color: #1f1712;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 34px;
      }
      .grid {
        display: grid;
        gap: 28px;
      }
      .concept {
        display: grid;
        gap: 18px;
        padding: 24px;
        border-radius: 28px;
        background: rgba(255, 248, 239, 0.76);
        box-shadow: 0 28px 70px rgba(40, 32, 26, 0.18);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 20px;
        align-items: center;
      }
      img {
        width: 100%;
        display: block;
        border-radius: 22px;
      }
      .icon {
        aspect-ratio: 1;
      }
      h2 {
        margin: 0;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Invest in Bali - logo concepten</h1>
    <main class="grid">
      <section class="concept">
        <h2>01 Villa Gate</h2>
        <div class="row">
          <img src="./logo-concept-01-villa-gate.svg" alt="Logo concept 01 Villa Gate" />
          <img class="icon" src="./logo-concept-01-villa-gate-icon.svg" alt="Icon concept 01 Villa Gate" />
        </div>
      </section>
      <section class="concept">
        <h2>02 IB Monogram</h2>
        <div class="row">
          <img src="./logo-concept-02-ib-monogram.svg" alt="Logo concept 02 IB Monogram" />
          <img class="icon" src="./logo-concept-02-ib-monogram-icon.svg" alt="Icon concept 02 IB Monogram" />
        </div>
      </section>
      <section class="concept">
        <h2>03 Estate Seal</h2>
        <div class="row">
          <img src="./logo-concept-03-estate-seal.svg" alt="Logo concept 03 Estate Seal" />
          <img class="icon" src="./logo-concept-03-estate-seal-icon.svg" alt="Icon concept 03 Estate Seal" />
        </div>
      </section>
      <section class="concept">
        <h2>04 Minimal Roof</h2>
        <div class="row">
          <img src="./logo-concept-04-minimal-roof.svg" alt="Logo concept 04 Minimal Roof" />
          <img class="icon" src="./logo-concept-04-minimal-roof-icon.svg" alt="Icon concept 04 Minimal Roof" />
        </div>
      </section>
    </main>
  </body>
</html>
